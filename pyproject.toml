[project]
name = "pychatgmail"
version = "0.1.0"
description = "A Python CLI tool to interact with Gmail and GPT."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Lee Shiueh", email = "lee.shiueh@gmail.com"}
]
dependencies = [
    "beautifulsoup4>=4.13.4",
    "click>=8.1.8",
    "google-api-python-client>=2.169.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.2",
    "llm>=0.25",
    "lxml>=5.4.0",
    "openai>=1.77.0",
    "pydantic>=2.11.4",
    "pytest>=8.3.5",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.1.0",
    "pytz>=2025.2",
    "requests>=2.32.3",
    "rich>=14.0.0",
    "tokenizers>=0.21.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11"
]
keywords = ["gmail", "gpt", "cli", "email", "chat"]
urls = {Homepage = "https://github.com/slee124565/pychatgmail"}

[project.scripts]
chatgmail = "chatgmail.cli:chatgmailcli"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
